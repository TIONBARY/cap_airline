<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CAP AIRLINE</title>
<meta name="description" content="비행기를 타고 세계를 누비며 각국의 수도를 맞히는 웹 게임. 틀리면 공해상에서 미사일이 날아온다 — 플레어를 뿌려 회피하라!">
<meta name="theme-color" content="#0b1b2e">

<!-- 파비콘: 이모지를 인라인 SVG로 (외부 파일·요청 없음) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.92em' font-size='92'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">

<!-- 링크 미리보기 (카카오톡·트위터·디스코드·슬랙 등)
     ⚠️ 미리보기 크롤러는 상대 경로를 못 읽으므로 og:url / og:image / twitter:image 는 반드시 절대 URL.
        커스텀 도메인을 붙이면 아래 세 곳의 호스트를 새 도메인으로 바꿀 것. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CAP AIRLINE">
<meta property="og:title" content="🌍 CAP AIRLINE — 비행기 타고 세계일주">
<meta property="og:description" content="100개국을 날아다니며 수도를 맞혀라. 틀리면 미사일이 날아온다 — 플레어를 뿌려 회피하라!">
<meta property="og:image" content="https://capairline.com/docs/play.jpg">
<meta property="og:image:width" content="1568">
<meta property="og:image:height" content="744">
<meta property="og:image:alt" content="블럭 세계지도 위를 나는 비행기와 유도 미사일">
<meta property="og:url" content="https://capairline.com/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🌍 CAP AIRLINE — 비행기 타고 세계일주">
<meta name="twitter:description" content="100개국을 날아다니며 수도를 맞혀라. 틀리면 미사일이 날아온다 — 플레어를 뿌려 회피하라!">
<meta name="twitter:image" content="https://capairline.com/docs/play.jpg">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --correct: #22c55e;
    --wrong: #ef4444;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }   /* 가로모드 전환 시 글자 확대 방지 */
  body {
    overscroll-behavior: none;               /* 당겨서 새로고침·바운스 방지 */
    touch-action: manipulation;              /* 더블탭 확대 방지 (탭 반응도 빨라짐) */
    -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: #0b1b2e;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .app {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 3;
  }
  .card {
    background: rgba(30, 41, 59, .88);
    backdrop-filter: blur(3px);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,.06);
  }

  /* ── 카메라 (블럭 지도 + 궤적을 통째로 줌/이동) ── */
  #camera {
    position: fixed;
    left: 0; top: 0;
    transform-origin: 0 0;
    z-index: 0;
    will-change: transform;
  }
  /* 지도 바깥 여백을 메우는 바다 블럭. #map보다 앞에 있어 뒤로 깔린다.
     #camera 안에 있으므로 카메라 transform에 같이 스케일돼 블럭이 항상 맞물린다. */
  #ocean {
    position: absolute;
    background-repeat: repeat;
    image-rendering: pixelated;
    pointer-events: none;
  }
  #map {
    position: absolute;
    left: 0; top: 0;
    image-rendering: pixelated;   /* 블럭 느낌 유지 */
  }
  #trail {
    position: absolute;
    left: 0; top: 0;
    overflow: visible;
    pointer-events: none;
  }
  .flight-obj {
    position: fixed;
    left: 0; top: 0;
    z-index: 6;
    pointer-events: none;
    will-change: transform;
    transform: translate(-100px, -100px);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  #plane { font-size: 60px; }
  /* 도착 핀: 국기 + 나라명 카드 */
  #pin {
    opacity: 0;
    z-index: 8;
    transition: opacity .25s ease;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }
  #pin.show { opacity: 1; }
  .pin-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 10px 9px;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    animation: pin-pop .3s cubic-bezier(.34,1.56,.64,1) .08s backwards;
  }
  .pin-flag {
    width: 66px;
    height: auto;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.2);
    display: block;
  }
  .pin-name {
    font-size: 14px;
    font-weight: 800;
    color: #f1f5f9;
    white-space: nowrap;
  }
  /* 생각 말풍선 꼬리: 비행기 쪽(왼쪽 아래)으로 작아지는 점 두 개 */
  .pin-tail {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    margin: 4px 0 0 10px;
  }
  .pin-tail span {
    display: block;
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    animation: pin-pop .25s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .pin-tail span:nth-child(1) { width: 10px; height: 10px; margin-left: 13px; animation-delay: .04s; }
  .pin-tail span:nth-child(2) { width: 6px;  height: 6px;  margin-left: 0;    animation-delay: 0s; }
  @keyframes pin-pop {
    from { transform: translateY(6px) scale(.85); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* 정답 폭죽 캔버스 (최상단) */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
  }

  /* ── 미사일 경보 연출 (붉은 비네트 + 경고 배너) ── */
  #danger {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s ease;
    box-shadow: inset 0 0 170px 45px rgba(220, 38, 38, .55);
  }
  body.alarm #danger { animation: danger-pulse .75s ease-in-out infinite; }
  @keyframes danger-pulse {
    0%, 100% { opacity: .4; }
    50%      { opacity: 1; }
  }
  #warn {
    position: fixed;
    top: 58px; left: 0; right: 0;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fecaca;
    text-shadow: 0 0 14px rgba(239,68,68,.95), 0 2px 6px rgba(0,0,0,.85);
    opacity: 0;
  }
  body.alarm #warn { animation: warn-blink .48s steps(1, end) infinite; }
  @keyframes warn-blink {
    0%, 62%  { opacity: 1; }
    63%,100% { opacity: .45; }
  }

  /* 사운드 토글 버튼 (HUD 우측) */
  #sfx-btn {
    background: rgba(30, 41, 59, .7);
    border: 1px solid rgba(255,255,255,.12);
    color: #cbd5e1;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.3;
    padding: 4px 10px;
  }
  #sfx-btn:hover { filter: brightness(1.3); }

  /* 비행 레이어는 게임 중에만 표시 */
  body:not(.flying) #trail,
  body:not(.flying) #plane,
  body:not(.flying) #pin { display: none; }

  /* 게임 중엔 가운데 카드 숨김 (문제는 지도 위 핀에) */
  body.flying .app { display: none; }

  /* 상단 HUD */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 7;
    padding: 14px 16px 12px;
    background: linear-gradient(to bottom, rgba(10,15,28,.9) 40%, rgba(10,15,28,0));
  }
  #hud .topbar { max-width: 460px; margin: 0 auto; color: #cbd5e1; font-size: 15px; }
  #lives { font-size: 20px; letter-spacing: 3px; }
  /* 목숨 0 = 마지막 기회 (여기서 또 틀리면 끝) */
  #lives.last-chance::after {
    content: " 마지막 기회!";
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0;
    color: #fca5a5;
    text-shadow: 0 0 10px rgba(239,68,68,.9);
    animation: last-chance-blink .9s ease-in-out infinite;
  }
  @keyframes last-chance-blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }
  body:not(.flying) #hud { display: none; }
  .title {   /* 로마자 워드마크라 자간을 벌려야 항공사 로고처럼 읽힌다 */
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
    color: #fff;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .btn-primary:hover { filter: brightness(1.08); }

  /* progress */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
  }
  .score { color: var(--accent); }
  .progress {
    height: 8px;
    background: var(--card2);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress > div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }

  .flag {
    font-size: 68px;
    text-align: center;
    line-height: 1;
    margin: 6px 0 10px;
  }
  .flag-img {
    width: 190px;
    height: auto;
    display: inline-block;
    vertical-align: middle;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
  }
  .question {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 22px;
  }
  .question b { color: var(--accent); }

  /* 입력창 */
  .answer-input {
    width: 100%;
    background: var(--card2);
    border: 2px solid transparent;
    color: var(--text);
    padding: 15px 18px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: all .12s ease;
  }
  .answer-input::placeholder { color: var(--muted); font-weight: 500; }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { background: rgba(34,197,94,.15); border-color: var(--correct); color: #86efac; }
  .answer-input.wrong { background: rgba(239,68,68,.15); border-color: var(--wrong); color: #fca5a5; }
  /* 답을 받는 중이 아니면(비행 중·미사일 연출 중) 흐리게 → Enter가 안 먹는다는 걸 눈으로 알린다.
     body.timing이 곧 "지금 답 받는 중"이라 새 플래그가 필요 없다 (타이머 게이지와 같은 조건). */
  body:not(.timing) #answer-input { opacity: .55; }

  /* 하단 고정 입력 바 */
  #answer-bar {
    position: fixed;
    left: 0; right: 0;
    bottom: var(--kb, 0px);   /* 모바일 키보드 높이만큼 올린다 (syncKeyboardInset) */
    z-index: 7;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    background: linear-gradient(to top, rgba(10,15,28,.96) 40%, rgba(10,15,28,0));
  }
  .answer-wrap { width: 100%; max-width: 460px; }
  #answer-bar .answer-input {
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }

  /* ── 정답 입력 제한시간 게이지 ── */
  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    opacity: 0;                       /* 도착 전에는 숨김 */
    transition: opacity .2s ease;
  }
  body.timing .timer-row { opacity: 1; }
  #timer {
    flex: 1;
    height: 7px;
    background: rgba(255,255,255,.13);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  #timer-fill {
    height: 100%;
    width: 100%;
    transform-origin: left center;    /* scaleX로 줄인다 (레이아웃 재계산 없음) */
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  #timer-num {
    font-size: 13px;
    font-weight: 800;
    color: #cbd5e1;
    font-variant-numeric: tabular-nums;   /* 숫자 폭 고정 → 안 흔들림 */
    min-width: 32px;
    text-align: right;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
  }
  body.timer-warn #timer-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  body.timer-danger #timer-fill { background: linear-gradient(90deg, #f87171, #ef4444); }
  body.timer-danger #timer-num { color: #fca5a5; animation: timer-pulse .5s ease-in-out infinite; }
  @keyframes timer-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  /* 정답/피드백 안내 (바 바로 위에 떠서 표시) */
  .feedback {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(var(--kb, 0px) + 86px);   /* 입력바와 같이 올라간다 */
    z-index: 7;
    text-align: center;
    min-height: 22px;
    font-size: 15px;
    font-weight: 700;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
  }
  .feedback.correct { color: #86efac; }
  .feedback.wrong { color: #fca5a5; }
  .feedback .answer-label { color: var(--accent); }

  /* 입력 바/피드백은 게임 중에만 표시 */
  body:not(.flying) #answer-bar,
  body:not(.flying) #feedback { display: none; }

  /* ── 세계일주 완주 배너 ── */
  #lap-clear {
    position: fixed;
    inset: 0;
    z-index: 11;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
    text-align: center;
  }
  #lap-clear.hidden { display: none; }   /* .hidden 보다 우선순위가 높아야 해서 명시 */
  /* 지도 위에서도 글자가 읽히도록 가운데만 어둡게 */
  #lap-clear::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(8,12,24,.78) 0%, rgba(8,12,24,.5) 36%, rgba(8,12,24,0) 68%);
    animation: lap-fade .4s ease backwards;
  }
  #lap-clear > * { position: relative; }   /* 비네트 위로 */
  @keyframes lap-fade { from { opacity: 0; } to { opacity: 1; } }
  .lap-emoji {
    font-size: 82px;
    line-height: 1;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.6));
    animation: lap-globe 1.1s cubic-bezier(.34,1.56,.64,1);
  }
  .lap-title {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #fde68a, #fbbf24, #fde68a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(251,191,36,.55)) drop-shadow(0 3px 8px rgba(0,0,0,.7));
    animation: lap-pop .5s cubic-bezier(.34,1.56,.64,1) .12s backwards;
  }
  .lap-sub {
    font-size: 16px;
    font-weight: 700;
    color: #e2e8f0;
    text-shadow: 0 2px 8px rgba(0,0,0,.9);
    animation: lap-pop .5s cubic-bezier(.34,1.56,.64,1) .26s backwards;
  }
  @keyframes lap-globe {
    0%   { transform: scale(.2) rotate(-140deg); opacity: 0; }
    60%  { transform: scale(1.15) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes lap-pop {
    from { transform: translateY(14px) scale(.8); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* result */
  .result-emoji { font-size: 64px; text-align: center; margin-bottom: 8px; }
  .result-score {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 2px;
  }
  .result-who { text-align: center; font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .result-msg { text-align: center; color: var(--muted); margin-bottom: 6px; font-size: 15px; }

  /* ── 이름 입력 / 랭킹 ── */
  #player-name { margin-bottom: 10px; }
  #start-btn, #restart-btn { margin-top: 4px; }
  .btn-ghost {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 9px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-ghost:hover { color: var(--text); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-7px); }
    40%, 80% { transform: translateX(7px); }
  }
  .shake { animation: shake .35s; }

  .rank-box { margin: 18px 0 10px; }
  .rank-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .rank-note { font-size: 11px; font-weight: 600; color: #64748b; }
  .rank-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 232px;
    overflow-y: auto;
  }
  .rank-row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 7px 11px;
    border-radius: 10px;
    background: rgba(51, 65, 85, .5);
    font-size: 14px;
    border: 1px solid transparent;
  }
  .rank-row.me { background: rgba(56,189,248,.16); border-color: rgba(56,189,248,.45); }
  .rank-no { text-align: center; font-weight: 800; color: var(--muted); font-size: 15px; }
  .rank-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rank-score { font-weight: 800; color: var(--accent); }
  .rank-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
  .rank-more { margin-top: 8px; color: var(--accent); font-size: 13px; }
  .rank-more:hover { filter: brightness(1.25); }

  /* ── 전체 랭킹 모달 ── */
  #rank-modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4, 8, 18, .72);
    backdrop-filter: blur(3px);
    animation: modal-fade .18s ease;
  }
  #rank-modal.hidden { display: none; }   /* .hidden 보다 우선순위가 높아야 해서 명시 */
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .rank-modal-card {
    width: 100%;
    max-width: 460px;
    max-height: min(78vh, 640px);
    display: flex;
    flex-direction: column;
    background: rgba(30, 41, 59, .97);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    animation: modal-pop .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modal-pop {
    from { transform: translateY(12px) scale(.96); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .rank-modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 2px;
  }
  #rank-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 8px;
  }
  #rank-close:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .rank-modal-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    min-height: 16px;
  }
  /* 모달 안의 목록만 길어질 수 있게 (시작 화면 목록은 짧게 유지) */
  #rank-all { max-height: none; overflow-y: auto; padding-right: 4px; }

  .hidden { display: none; }

  /* ── 좁은 화면(모바일) ── */
  @media (max-width: 560px) {
    body { padding: 12px; }
    .card { padding: 20px 16px 18px; border-radius: 16px; }
    .flag { font-size: 52px; margin: 2px 0 8px; }
    .title { font-size: 24px; letter-spacing: 3px; }
    .subtitle { font-size: 12.5px; margin-bottom: 16px; }

    /* 비행기를 줄이면 말풍선·조준선은 JS가 이 크기에 맞춰 자동 계산한다 (planePx) */
    #plane { font-size: 44px; }
    .pin-flag { width: 52px; }
    .pin-name { font-size: 12px; }
    .pin-card { padding: 6px 8px 7px; gap: 4px; }

    #hud { padding: 10px 12px; }
    #lives { font-size: 17px; letter-spacing: 2px; }
    #lives.last-chance::after { font-size: 12px; }
    #warn { font-size: 14px; top: 50px; }

    #answer-bar { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    /* 16px 미만이면 iOS 사파리가 입력 시 화면을 확대해버린다 — 절대 줄이지 말 것 */
    .answer-input { padding: 12px 14px; font-size: 16px; border-radius: 12px; }
    .feedback { font-size: 13px; bottom: calc(var(--kb, 0px) + 74px); }
    .timer-row { margin-bottom: 6px; }

    .rank-list { max-height: 176px; }
    .rank-row { padding: 6px 9px; font-size: 13px; grid-template-columns: 24px 1fr auto; }
    .rank-modal-card { padding: 14px 14px 12px; max-height: 84dvh; }
    #rank-close { padding: 6px 10px; font-size: 20px; }   /* 터치 영역 확보 */

    .lap-emoji { font-size: 62px; }
    .lap-title { font-size: 32px; }
    .lap-sub { font-size: 13px; }

    .result-emoji { font-size: 52px; }
    .result-score { font-size: 32px; }
  }
</style>

<!-- 카메라: 블럭 지도 + 비행 궤적 (통째로 줌인/줌아웃 됨) -->
<div id="camera">

  <canvas id="map"></canvas>
  <svg id="trail" preserveAspectRatio="none"></svg>
</div>

<!-- 화면 고정 오브젝트: 비행기 + 도착 핀(국기·나라명) -->

<!-- 정답 폭죽 / 미사일 / 폭발 -->
<canvas id="fx"></canvas>

<div id="danger"></div>

</div>

<!-- 전체 랭킹 (모달) -->
<div id="rank-modal" class="hidden">
  <div class="rank-modal-card">
    <div class="rank-modal-head">
      <span>🏆 전체 랭킹</span>

    </div>
    <div class="rank-modal-sub" id="rank-total"></div>
    <div class="rank-list" id="rank-all"></div>
  </div>
</div>

<!-- 상단 HUD: 진행도 / 점수 (게임 중에만 표시) -->
<div id="hud">

    <span id="lives">❤️❤️</span>
    <span class="score" id="q-score">정답 0</span>
    <button id="sfx-btn" type="button" title="소리 켜기/끄기">🔊</button>
  </div>
</div>

<!-- 하단 정답 입력 바 (게임 중에만 표시) -->
<div class="feedback" id="feedback"></div>
<div id="answer-bar">

    <div class="timer-row">
      <div id="timer"><div id="timer-fill"></div></div>
      <span id="timer-num">7.0</span>
    </div>

           placeholder="도착한 나라의 수도를 입력하고 Enter" autocomplete="off"
           autocapitalize="off" spellcheck="false">
  </div>
</div>

<div class="app">
  <div class="card">

    <!-- 시작 화면 -->
    <div id="start-screen">
      <div class="flag">🌍</div>
      <div class="title">CAP AIRLINE</div>
      <div class="subtitle">비행기로 세계를 누비며 수도를 맞혀라!<br>

      <div class="rank-box" id="start-rank">
        <div class="rank-head"><span>🏆 랭킹 TOP 5</span><span class="rank-note"></span></div>
        <div class="rank-list"></div>
        <button class="btn-ghost rank-more" type="button">전체 랭킹 보기 →</button>
      </div>
    </div>

    <!-- 퀴즈 화면: 가운데 카드 없음 (문제는 지도 위 핀에 표시) -->
    <div id="quiz-screen" class="hidden"></div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="hidden">

</div>

  const cameraEl = document.getElementById("camera");

  const PALETTE = {
    ".": ["#173a5e", "#1a3f66"],   // 바다
    "g": ["#4f9d5b", "#58a866"],   // 초원
    "d": ["#c9a24b", "#bd9744"],   // 사막

  function drawMap() {
    mapCtx.clearRect(0, 0, WORLD_W, WORLD_H);
    for (let r = 0; r < MAP_ROWS; r++) {
      const row = WORLD_GRID[r] || "";
      for (let c = 0; c < MAP_COLS; c++) {
        const shades = PALETTE[row[c]] || PALETTE["."];
        mapCtx.fillStyle = shades[(c + r) & 1];
        mapCtx.fillRect(c * CELL, r * CELL, CELL - 1.2, CELL - 1.2); // -1.2: 블럭 간격
      }
    }
  }
  drawMap();

  // ── 지도 바깥 바다 채우기 ──────────────────────
  // 지도(120×60)는 화면비가 고정이라 넓은 모니터에서는 좌우에, 세로 화면에서는 위아래에
  // 배경색만 남는다. 그 여백을 **같은 바다 블럭**으로 메운다.
  //
  // 캔버스를 키우지 않는다 — 넓은 화면일수록 캔버스가 수천만 픽셀로 불어나고 리사이즈마다
  // 다시 그려야 한다. 대신 #camera 안에 background-repeat 타일 div를 깔면 카메라 transform에
  // 같이 스케일돼서 **어떤 배율에서도 블럭이 정확히 맞물리고, 그리는 비용이 0**이다.
  const BLOCK_GAP = "#0b1b2e";        // 블럭 사이 틈 색 = body 배경색 (바뀌면 같이 맞출 것)
  const OCEAN_TILE = CELL * 2;        // 체크무늬 주기(2칸). 여백은 이 배수여야 이음매가 안 생긴다
  const oceanEl = document.getElementById("ocean");

  // drawMap과 똑같은 방식으로 바다 2×2칸을 그려 타일 이미지로 만든다
  function makeOceanTile() {
    const cv = document.createElement("canvas");
    cv.width = cv.height = OCEAN_TILE;
    const g = cv.getContext("2d");
    g.fillStyle = BLOCK_GAP;
    g.fillRect(0, 0, OCEAN_TILE, OCEAN_TILE);
    const shades = PALETTE["."];
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 2; c++) {
        g.fillStyle = shades[(c + r) & 1];
        g.fillRect(c * CELL, r * CELL, CELL - 1.2, CELL - 1.2);
      }
    }
    return cv.toDataURL();
  }
  oceanEl.style.backgroundImage = `url(${makeOceanTile()})`;
  oceanEl.style.backgroundSize = `${OCEAN_TILE}px ${OCEAN_TILE}px`;

  // 화면 크기에 맞춰 여백 폭을 다시 잡는다 (로드 시 + resize 때).
  // 기준은 **게임 중 가장 많이 줌아웃되는 배율** = flyTo의 cruise 하한(fitScale()*0.9).
  // 그 배율에서 카메라가 지도 끝을 보고 있어도 화면 절반이 더 채워져야 여백이 안 보인다.
  function sizeOcean() {
    const minScale = fitScale() * 0.9;
    const need = Math.max(window.innerWidth, window.innerHeight) / 2 / minScale * 1.1
               + OCEAN_TILE * 2;                       // 10% + 2칸 = 스크린 셰이크·반올림 여유
    const pad = Math.ceil(need / OCEAN_TILE) * OCEAN_TILE;   // 타일 배수로 맞춰야 체크무늬가 이어진다

    oceanEl.style.left = `${-pad}px`;

    oceanEl.style.width = `${WORLD_W + pad * 2}px`;

  }

  // 등거리원통도법: 위경도 → 월드 좌표(px)
  function project(lat, lon) {
    return {

      y: (90 - lat) / 180 * WORLD_H,

  // ── 카메라 (월드 → 화면 변환, 줌/이동) ──
  let cam = { s: 1, tx: 0, ty: 0 };
  let midFlight = false;
  let shake = { x: 0, y: 0 };   // 스크린 셰이크 오프셋
  function applyCamera() {
    cameraEl.style.transform =
      `translate(${cam.tx + shake.x}px, ${cam.ty + shake.y}px) scale(${cam.s})`;
  }
  // 폭발 시 지도 흔들기
  function screenShake(power = 16, ms = 450) {
    const t0 = performance.now();
    (function step(now) {
      const k = 1 - (now - t0) / ms;
      if (k > 0) {
        shake.x = (Math.random() - 0.5) * power * 2 * k;
        shake.y = (Math.random() - 0.5) * power * 2 * k;
        applyCamera();
        requestAnimationFrame(step);
      } else {
        shake.x = shake.y = 0;
        applyCamera();
      }
    })(t0);
  }
  function worldToScreen(wx, wy) {
    return { x: cam.tx + cam.s * wx, y: cam.ty + cam.s * wy };
  }
  function fitScale() {
    return Math.min(window.innerWidth / WORLD_W, window.innerHeight / WORLD_H) * 0.98;
  }
  function focusCamera(fx, fy, s) {
    cam.s = s;
    cam.tx = window.innerWidth / 2 - s * fx;
    cam.ty = window.innerHeight / 2 - s * fy;
    applyCamera();
  }
  function overviewCamera() {
    focusCamera(WORLD_W / 2, WORLD_H / 2, fitScale());
  }
  // 현재 시점에서 목표 월드좌표·배율로 부드럽게 이동 (완주 연출의 줌아웃)
  function tweenCamera(toX, toY, toS, ms) {
    const fromS = cam.s;
    const fromX = (window.innerWidth / 2 - cam.tx) / cam.s;   // 지금 화면 중앙의 월드 좌표
    const fromY = (window.innerHeight / 2 - cam.ty) / cam.s;
    const t0 = performance.now();
    (function step(now) {
      const t = Math.min((now - t0) / ms, 1);
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      focusCamera(fromX + (toX - fromX) * e, fromY + (toY - fromY) * e, fromS + (toS - fromS) * e);
      if (t < 1) requestAnimationFrame(step);
    })(t0);
  }
  overviewCamera();

  //    미디어쿼리로 #plane 크기가 바뀌면 나머지가 자동으로 따라온다.
  let planePx = 60;

    planePx = parseFloat(getComputedStyle(planeEl).fontSize) || 60;

  syncPlaneSize();

  // ② 소프트 키보드가 입력바를 덮는 문제.
  //    position:fixed는 **레이아웃** 뷰포트 기준이라 키보드가 올라와도 바닥에 붙어 가려진다.
  //    visualViewport(실제로 보이는 영역)와의 차이만큼 --kb 로 올려준다.
  function syncKeyboardInset() {
    const vv = window.visualViewport;
    if (!vv) return;
    const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", inset + "px");
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncKeyboardInset);
    window.visualViewport.addEventListener("scroll", syncKeyboardInset);
    syncKeyboardInset();
  }

  // 비행기: 화면 좌표(x,y)에 중심 맞춤 (크기 일정)
  function placePlane(x, y, rotDeg) {
    planeEl.style.transform =
      `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${rotDeg}deg)`;
  }
  // 핀: 생각 말풍선처럼 도시 지점(x,y)의 오른쪽 위로 비켜 띄운다 (비행기를 안 가리게)
  // 말풍선 꼬리(작은 점)가 왼쪽 아래 = 비행기 쪽을 가리키도록 bottom-left 기준으로 배치
  function placePin(x, y) {
    // 오프셋을 비행기 크기에서 계산한다 → CSS로 #plane 크기를 바꿔도 자동으로 따라온다.
    // 계수는 60px 기준 실측값(+54, -32)에서 뽑았다. (0.90 / 0.53)
    pinEl.style.transform =
      `translate(${x + planePx * 0.90}px, ${y - planePx * 0.53}px) translate(0, -100%)`;
  }
  // 비행 종료 후: 도착지에 줌인 + 핀(국기·나라명) 표시
  function idleAtDest() {
    if (!destCountry) return;
    const E = project(destCountry.lat, destCountry.lon);
    focusCamera(E.x, E.y, fitScale() * 3.0);
    const s = worldToScreen(E.x, E.y);
    // 도착 시점에만 핀 내용(국기+나라명) 채움
    pinEl.innerHTML =
      `<div class="pin-card">
         <img class="pin-flag" src="https://flagcdn.com/w160/${destCountry.code}.png" alt="${destCountry.country} 국기">
         <div class="pin-name">${destCountry.country}</div>
       </div>
       <div class="pin-tail"><span></span><span></span></div>`;
    placePin(s.x, s.y);
    pinEl.classList.add("show");
    // 도착지에 비행기도 그대로 세워둔다 (말풍선은 오른쪽 위로 비켜 있어 안 가림)
    placePlane(s.x, s.y, -18);
    planeEl.style.opacity = "1";
    // 새 나라 도착 → 이전 피드백 지우고 깨끗하게 답 입력 대기
    const fb = document.getElementById("feedback");
    fb.textContent = "";
    fb.className = "feedback";

  // 시작점 S → 도착점 E 로 비행기가 곡선을 그리며 날아감 (카메라 줌인/줌아웃)
  function flyTo(q) {
    cancelAnimationFrame(flightAnim);
    stopAnswerTimer();          // 비행 중에는 제한시간이 돌지 않는다
    const E = project(q.lat, q.lon);
    const S = lastPos || { x: WORLD_W / 2, y: WORLD_H * 0.45 };
    destCountry = q;
    midFlight = true;
    planeEl.style.opacity = "1";

    // 핀은 도착했을 때(idleAtDest)만 채운다 → 출발 중 다음 나라 노출 방지.
    // 국기만 미리 로드해 도착 시 팝인 지연 방지.
    new Image().src = `https://flagcdn.com/w160/${q.code}.png`;
    pinEl.classList.remove("show");
    pinEl.innerHTML = "";   // 출발 즉시 비워 이전 핀 잔상/다음 나라 노출 방지

    // 위로 볼록한 호(arc): 제어점을 두 점 중앙에서 위로 (월드 좌표)
    const dist = Math.hypot(E.x - S.x, E.y - S.y);
    const C = {
      x: (S.x + E.x) / 2,
      y: (S.y + E.y) / 2 - Math.min(dist * 0.3, 300) - 40,
    };

    // 궤적 (월드 좌표, 확대해도 선 굵기 일정)
    trailEl.innerHTML =
      `<path id="trail-path" d="M ${S.x} ${S.y} Q ${C.x} ${C.y} ${E.x} ${E.y}"
             fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"
             stroke-dasharray="10 12" vector-effect="non-scaling-stroke" opacity="0.95"/>`;
    const trailPath = document.getElementById("trail-path");
    const pathLen = trailPath.getTotalLength();
    trailPath.style.strokeDashoffset = pathLen;

    // 카메라 배율: 양끝은 확대(zoom), 중간은 축소(cruise)해서 액티비티 부여
    const fit = fitScale();
    const zoomScale = fit * 3.0;
    const cruiseScale = Math.max(
      fit * 0.9,
      Math.min(zoomScale * 0.85, (Math.min(window.innerWidth, window.innerHeight) * 0.62) / (dist + 1))
    );

    const bezier = (t, a, b, c) =>
      (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
    const dBezier = (t, a, b, c) =>
      2 * (1 - t) * (b - a) + 2 * t * (c - b);
    const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    // 비행 시간은 **거리에 비례**한다. 예전엔 1800ms 고정이었는데,
    // 실측(20판·1980회) 결과 연속 두 나라 사이 거리가 3px~1127px로 **330배** 벌어진다.
    // 고정이면 인접국끼리도 1.8초를 통째로 기다리게 되고(전체의 10%가 96px 이하),
    // 짧은 비행은 cruiseScale이 거의 줌아웃도 안 해서 정지 화면을 보고 있는 꼴이 된다.
    // 하한 700ms(툭툭 넘어감) / 상한 2000ms(대륙 횡단의 무게감).
    const DURATION = Math.min(2000, Math.max(700, 600 + dist * 1.5));
    const t0 = performance.now();

    function frame(now) {
      const raw = Math.min((now - t0) / DURATION, 1);
      const t = easeInOut(raw);

      // 비행기 월드 좌표
      const wx = bezier(t, S.x, C.x, E.x);
      const wy = bezier(t, S.y, C.y, E.y);
      const dx = dBezier(t, S.x, C.x, E.x);
      const dy = dBezier(t, S.y, C.y, E.y);

      // 카메라: 경로 따라 이동 + 중간에 줌아웃
      const focusX = S.x + (E.x - S.x) * t;
      const focusY = S.y + (E.y - S.y) * t;
      const s = zoomScale + (cruiseScale - zoomScale) * Math.sin(Math.PI * raw);
      focusCamera(focusX, focusY, s);

      // 비행기 화면 좌표 (카메라 반영, 크기 일정) — ✈️ 기본 북동(-45°) 보정 +45°
      const sc = worldToScreen(wx, wy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI + 45;
      placePlane(sc.x, sc.y, angle);

      trailPath.style.strokeDashoffset = pathLen * (1 - raw);

      if (raw < 1) {
        flightAnim = requestAnimationFrame(frame);
      } else {
        lastPos = E;
        midFlight = false;
        idleAtDest();       // 도착지 줌인 + 핀 표시
        armAnswerInput();   // 입력 리셋 + "비행 중" 해제 — 답을 받기 시작하는 유일한 지점
        startAnswerTimer(); // 제한시간은 **도착 순간에만** 시작한다.
        // (idleAtDest 안에 넣으면 리사이즈 때도 호출돼서 타이머가 리셋된다 = 치트)
      }
    }
    flightAnim = requestAnimationFrame(frame);
  }

  function ac() {
    if (muted) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();

    if (actx.state === "suspended") actx.resume();

  }
  function getNoise(ctx) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

  // 톤: 주파수 f0 → f1 로 미끄러지며 감쇠
  function tone(f0, f1, dur, vol = .2, type = "sine", when = 0) {
    const ctx = ac(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + .03);
  }
  // 노이즈: 로우패스 컷오프를 c0 → c1 로 쓸며 감쇠 (쉬익 / 쾅)
  function noiseHit(dur, vol, c0, c1, q = 1, when = 0) {
    const ctx = ac(); if (!ctx) return;
    const t = ctx.currentTime + when;
    const s = ctx.createBufferSource();
    s.buffer = getNoise(ctx); s.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = q;
    f.frequency.setValueAtTime(c0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(c1, 20), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(ctx.destination);
    s.start(t); s.stop(t + dur + .03);
  }

        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: .007 + Math.random() * .006,      // 오래 탄다
        size: 5 + Math.random() * 3.5, grav: .07, drag: .986,
        streak: true,
        // 밝기를 낮춰야 가산합성에서 코어만 하얗게 타고 주변은 주황으로 읽힌다
        color: `hsl(${28 + Math.random() * 18}, 100%, ${58 + Math.random() * 14}%)`,
      });
      if (i % 2 === 0) fxParticles.push({                 // 플레어 연기
        x, y, vx: Math.cos(a) * sp * .45, vy: Math.sin(a) * sp * .45,
        life: .9, decay: .011, size: 5 + Math.random() * 4, grav: .01, growth: .4,
        smoke: true, color: "#c2c8d4",
      });
    }
    ensureFxLoop();
  }

  // 비행기에서 플레어(적외선 기만탄) 사출 → 미사일이 물 "기만점" 반환
  function spawnFlares(x, y, ang) {
    sfx.flare();
    screenShake(7, 240);                                  // 사출 반동
    flash = Math.max(flash, .3);                          // 순간 섬광
    fxRings.push({ x, y, r: 4, vr: 10, w: 8, life: 1, decay: .055, color: "255,222,150" });
    flareVolley(x, y, ang, 12);

    // 디스펜서처럼 2·3차 연속 사출. 회피 기동 중인 **현재** 비행기 위치에서 뿌려져
    // 기동하는 비행기 뒤로 불꽃이 줄줄이 흩뿌려진다.
    for (let k = 1; k <= 2; k++) setTimeout(() => {
      if (!missile) return;
      if (k === 1) sfx.flare();
      flareVolley(missile.plane.x, missile.plane.y, ang + (Math.random() - .5) * .6, 10);
    }, k * 130);

    // 미사일이 쫓아갈 대표 기만점 (플레어 무리와 함께 흘러감)
    return { x, y, vx: Math.cos(ang) * 5.4, vy: Math.sin(ang) * 5.4 };
  }

  // 미사일 폭발: 섬광 → 충격파 → 불덩이 → 파편 → 연기
  // k = 규모 (1 = 명중, 0.6 = 플레어 유폭 같은 작은 폭발)
  function explode(x, y, k = 1) {
    sfx.boom(k);
    flash = Math.max(flash, .6 * k);
    fxRings.push({ x, y, r: 6,  vr: 11 * k, w: 20 * k, life: 1, decay: .024, color: "255,205,130" });
    fxRings.push({ x, y, r: 3,  vr: 19 * k, w: 5,      life: 1, decay: .05,  color: "255,255,255" });

    for (let i = 0; i < 52 * k; i++) {      // 불덩이 (안쪽 흰빛 → 바깥 주황)
      const a = Math.random() * Math.PI * 2;
      const sp = .6 + Math.random() * 9;
      const hot = sp < 3;
      fxParticles.push({
        x, y, vx: Math.cos(a) * sp * k, vy: Math.sin(a) * sp * k,
        life: 1, decay: .016 + Math.random() * .018,
        size: ((hot ? 4.5 : 3) + Math.random() * 4) * k, grav: .03, drag: .935,
        color: `hsl(${hot ? 42 + Math.random() * 10 : 8 + Math.random() * 22}, 100%, ${hot ? 74 : 50 + Math.random() * 12}%)`,
      });
    }
    for (let i = 0; i < 26 * k; i++) {      // 파편 (빠르고 작고 멀리 튐)
      const a = Math.random() * Math.PI * 2;
      const sp = (5 + Math.random() * 9) * k;
      fxParticles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: .011 + Math.random() * .012, size: 1.2 + Math.random() * 1.4,
        grav: .16, drag: .995,
        color: `hsl(${Math.random() * 40}, 100%, ${70 + Math.random() * 20}%)`,
      });
    }
    for (let i = 0; i < 20 * k; i++) {      // 연기 (부풀며 천천히 떠오름)
      const a = Math.random() * Math.PI * 2;
      const sp = .4 + Math.random() * 2.4;
      fxParticles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .5,
        life: 1, decay: .006 + Math.random() * .006, size: (5 + Math.random() * 6) * k,
        grav: -.012, drag: .96, growth: .45, smoke: true,
        color: i % 3 ? "#8d94a3" : "#5f6675",
      });
    }
  }

  // 무작위 공해상(화면 가장자리)에서 목표(tx,ty)의 비행기로 미사일 발사
  // fatal=false → 플레어에 속아 유폭(회피 성공) / fatal=true → 재포착 후 명중(격추)
  function launchMissile(tx, ty, done, fatal = false) {
    const side = Math.floor(Math.random() * 3);   // 0 위 / 1 왼 / 2 오른 (하단 UI 회피)
    let sx, sy;
    if (side === 0)      { sx = window.innerWidth * (.15 + Math.random() * .7); sy = -70; }
    else if (side === 1) { sx = -70; sy = window.innerHeight * (.1 + Math.random() * .5); }
    else                 { sx = window.innerWidth + 70; sy = window.innerHeight * (.1 + Math.random() * .5); }

    // 처음엔 목표에서 일부러 빗나간 각도로 → 호밍하며 크게 휘어 들어온다
    const off = (Math.random() < .5 ? -1 : 1) * (.55 + Math.random() * .35);
    const now = performance.now();
    missile = {
      x: sx, y: sy, ang: Math.atan2(ty - sy, tx - sx) + off,
      speed: 6.5, accel: .11, maxSpeed: 18, turn: .038,
      home: { x: tx, y: ty },      // 회피 기동의 기준점 (도착지)
      plane: { x: tx, y: ty },     // 실제 비행기 위치 (매 프레임 갱신)
      // 회피(비치명): chase → decoyed → 유폭  /  격추(치명): chase → 명중 (플레어 없음)
      phase: "chase",
      decoy: null, fatal,
      missDist: 110 + Math.random() * 80,   // 회피 시 이만큼 벌어진 뒤 유폭 (매번 다르게)
      born: now, last: now, phaseAt: now, lastBeep: 0,
      done,
    };
    document.body.classList.add("alarm");
    sfx.launch();
    ensureFxLoop();
  }

  // 격추(마지막 오답): 비행기에 명중 → 큰 폭발 + 강한 흔들림 + 비행기 소멸
  function hitPlane(m) {
    explode(m.x, m.y);
    screenShake(24, 620);
    document.body.classList.remove("alarm");
    planeEl.style.opacity = "0";
    const cb = m.done;
    missile = null;
    if (cb) setTimeout(cb, 620);   // 폭발을 좀 보여주고 결과 화면으로
  }

  // 회피 성공(평소 오답): 미사일이 플레어를 물고 비행기에서 떨어진 곳에서 유폭
  function evadeMissile(m) {
    explode(m.x, m.y, .6);
    screenShake(11, 340);
    document.body.classList.remove("alarm");
    const cb = m.done;
    missile = null;                // 비행기는 그대로 살아서 다음 나라로 출발
    if (cb) setTimeout(cb, 520);
  }

  // 록온 조준선 (비행기 주변, 가까울수록 조여든다)
  function drawLockOn(x, y, dist, now) {
    const close = Math.max(0, Math.min(1, 1 - dist / 650));
    // 비행기를 감쌀 만큼 커야 한다. 계수는 60px 기준(128 → 90)에서 뽑았다.
    const r = planePx * 2.13 - planePx * 0.63 * close;
    const a = .3 + .5 * (.5 + .5 * Math.sin(now / (90 - close * 45)));
    fxCtx.save();
    fxCtx.translate(x, y);
    fxCtx.strokeStyle = `rgba(248,113,113,${a})`;
    fxCtx.lineWidth = 2;
    fxCtx.beginPath(); fxCtx.arc(0, 0, r * .62, 0, Math.PI * 2); fxCtx.stroke();
    fxCtx.rotate(now / 700);
    const b = r * .72, len = 11;
    for (let i = 0; i < 4; i++) {          // 네 귀퉁이 브래킷
      fxCtx.rotate(Math.PI / 2);
      fxCtx.beginPath();
      fxCtx.moveTo(b - len, b); fxCtx.lineTo(b, b); fxCtx.lineTo(b, b - len);
      fxCtx.stroke();
    }
    fxCtx.restore();
  }

  function updateMissile(now) {
    const m = missile;
    const dt = Math.min((now - m.last) / 16.667, 3);   // 60fps 기준 프레임 배수
    m.last = now;
    const age = now - m.born;
    const et = age / 1000;

    // 비행기 회피 기동: 좌우로 지그재그 + 뱅크(기울기)
    m.plane.x = m.home.x + Math.sin(et * 3.4) * 30;
    m.plane.y = m.home.y + Math.sin(et * 2.3 + 1) * 15;
    placePlane(m.plane.x, m.plane.y, -18 + Math.cos(et * 3.4) * 26);

    // 조준 목표: 추격 중엔 비행기, 기만당했으면 플레어
    let tgt = m.plane;
    if (m.phase === "decoyed" && m.decoy) {
      m.decoy.x += m.decoy.vx * dt;
      m.decoy.y += m.decoy.vy * dt;
      m.decoy.vy += .08 * dt;
      tgt = m.decoy;
    }

    // 유도: 선회율 제한을 둔 조향 → 직선이 아니라 부드러운 호를 그린다
    const want = Math.atan2(tgt.y - m.y, tgt.x - m.x);
    const diff = ((want - m.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const lim = m.turn * dt;
    m.ang += Math.max(-lim, Math.min(lim, diff));
    m.speed = Math.min(m.maxSpeed, m.speed + m.accel * dt);
    m.x += Math.cos(m.ang) * m.speed * dt;
    m.y += Math.sin(m.ang) * m.speed * dt;

    const dist = Math.hypot(m.plane.x - m.x, m.plane.y - m.y);

    // 경고음: 가까울수록 빨라진다
    if (now - m.lastBeep > Math.max(130, Math.min(dist * 1.6, 480))) {
      m.lastBeep = now; sfx.warn();
    }

    // 배기 화염 + 연기 자취
    const bx = m.x - Math.cos(m.ang) * 24, by = m.y - Math.sin(m.ang) * 24;
    for (let i = 0; i < 2; i++) fxParticles.push({
      x: bx, y: by, vx: (Math.random() - .5) * .9 - Math.cos(m.ang) * .8,
      vy: (Math.random() - .5) * .9 - Math.sin(m.ang) * .8,
      life: .85, decay: .06, size: 2.5 + Math.random() * 2.5, grav: 0, drag: .9,
      color: `hsl(${20 + Math.random() * 28}, 100%, ${68 + Math.random() * 20}%)`,
    });
    if (Math.random() < .85) fxParticles.push({
      x: m.x - Math.cos(m.ang) * 30, y: m.y - Math.sin(m.ang) * 30,
      vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5,
      life: .75, decay: .012, size: 3.5 + Math.random() * 2.5, grav: -.005,
      growth: .28, smoke: true, color: "#aab1bf",
    });

    // ── 페이즈 전환 ──
    if (m.phase === "chase") {
      if (m.fatal) {
        // 마지막 오답(격추): **플레어를 안 쓴다.** 록온이 풀리지 않고 그대로 명중한다.
        // 가까워질수록 선회율을 올려, 회피 기동하는 비행기를 놓치고 맴도는 일이 없게 한다.
        // 가까워질수록 선회율을 올려 확실히 문다 (회피 기동하는 비행기를 놓치고 맴돌지 않게).
        // 선회율을 초반에 더 낮춰봤자 직선으로 꽂혀 오히려 빨리 끝난다 — 측정으로 확인함.
        m.turn = Math.min(.34, m.turn + .0022 * dt);
        m.maxSpeed = 20;
        if (dist < 38) { hitPlane(m); return; }
        if (age > 5000) {                                   // 안전장치: 비행기 자리에서 폭발
          m.x = m.plane.x; m.y = m.plane.y;
          hitPlane(m); return;
        }
      } else if (dist < 300 && age > 250) {                 // 플레어 사출 → 미사일 기만
        const side = Math.random() < .5 ? -1 : 1;
        const away = Math.atan2(m.plane.y - m.y, m.plane.x - m.x) + side * (1.15 + Math.random() * .3);
        m.decoy = spawnFlares(m.plane.x, m.plane.y, away);
        m.phase = "decoyed"; m.turn = .055; m.phaseAt = now;
      } else if (dist < 40) {                               // 플레어 전에 붙어버린 예외
        evadeMissile(m); return;
      }
    } else if (m.phase === "decoyed") {
      // 여기는 회피(비치명) 전용 경로다. 격추는 chase에서 바로 끝난다.
      const dd = Math.hypot(m.decoy.x - m.x, m.decoy.y - m.y);
      const reached = dd < 38 || now - m.phaseAt > 620;
      // 비행기 옆을 스쳐 지나 충분히 멀어진 뒤에 유폭해야 "빗나갔다"로 읽힌다
      if ((reached && dist > m.missDist) || now - m.phaseAt > 1300) { evadeMissile(m); return; }
    }

    // 플레어에 속아 있는 동안엔 록온이 풀린 상태 → 조준선 안 그림
    if (m.phase !== "decoyed") drawLockOn(m.plane.x, m.plane.y, dist, now);

    // ── 미사일 본체 ──
    fxCtx.save();
    fxCtx.translate(m.x, m.y);
    fxCtx.rotate(m.ang);
    const fl = 18 + Math.random() * 16;                     // 흔들리는 배기 화염
    const grd = fxCtx.createLinearGradient(-24, 0, -24 - fl, 0);
    grd.addColorStop(0, "rgba(255,244,190,.95)");
    grd.addColorStop(.4, "rgba(255,150,45,.75)");
    grd.addColorStop(1, "rgba(255,70,0,0)");
    fxCtx.fillStyle = grd;
    fxCtx.beginPath();
    fxCtx.moveTo(-24, -4.5); fxCtx.lineTo(-24 - fl, 0); fxCtx.lineTo(-24, 4.5);
    fxCtx.closePath(); fxCtx.fill();

    fxCtx.shadowBlur = 14; fxCtx.shadowColor = "rgba(248,113,113,.9)";
    fxCtx.fillStyle = "#e5e7eb";                            // 동체
    fxCtx.beginPath();
    fxCtx.moveTo(-24, -4); fxCtx.lineTo(6, -4); fxCtx.lineTo(6, 4); fxCtx.lineTo(-24, 4);
    fxCtx.closePath(); fxCtx.fill();
    fxCtx.fillStyle = "#ef4444";                            // 탄두
    fxCtx.beginPath();
    fxCtx.moveTo(6, -4); fxCtx.lineTo(17, 0); fxCtx.lineTo(6, 4);
    fxCtx.closePath(); fxCtx.fill();
    fxCtx.shadowBlur = 0;
    fxCtx.fillStyle = "#9ca3af";                            // 꼬리날개 + 카나드
    fxCtx.beginPath();
    fxCtx.moveTo(-24, -4); fxCtx.lineTo(-32, -11); fxCtx.lineTo(-17, -4); fxCtx.closePath();
    fxCtx.moveTo(-24, 4);  fxCtx.lineTo(-32, 11);  fxCtx.lineTo(-17, 4);  fxCtx.closePath();
    fxCtx.moveTo(-1, -4);  fxCtx.lineTo(-7, -9);   fxCtx.lineTo(3, -4);   fxCtx.closePath();
    fxCtx.moveTo(-1, 4);   fxCtx.lineTo(-7, 9);    fxCtx.lineTo(3, 4);    fxCtx.closePath();
    fxCtx.fill();
    fxCtx.restore();
  }

  function fxLoop(now) {
    now = now || performance.now();
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    // 물리 갱신 (항력 + 중력 + 팽창)
    const born = [];   // 순회 중에 배열을 건드리면 안 되므로 따로 모았다가 뒤에 붙인다
    for (const p of fxParticles) {
      const drag = p.drag ?? .985;
      p.vx *= drag;
      p.vy = p.vy * drag + (p.grav ?? .055);
      p.x += p.vx; p.y += p.vy;
      if (p.growth) p.size += p.growth;
      p.life -= p.decay;
      // 플레어는 타면서 불티를 흘린다 → 궤적이 선명해진다
      if (p.streak && p.life > .2 && Math.random() < .6) {
        born.push({
          x: p.x, y: p.y,
          vx: (Math.random() - .5) * .9, vy: (Math.random() - .5) * .9 - .15,
          life: .8, decay: .035 + Math.random() * .02,
          size: 1.4 + Math.random() * 1.6, grav: .01, drag: .93,
          color: `hsl(${38 + Math.random() * 16}, 100%, ${80 + Math.random() * 15}%)`,
        });
      }
    }
    fxParticles = fxParticles.filter(p => p.life > 0);
    if (born.length) fxParticles.push(...born);

    // 1) 연기는 일반 합성으로 먼저 (뒤에 깔린다)
    for (const p of fxParticles) {
      if (!p.smoke) continue;
      fxCtx.globalAlpha = Math.max(p.life, 0) * .22;
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    }

    // 2) 불꽃·파편은 가산 합성으로 (겹칠수록 하얗게 타오름)
    fxCtx.globalCompositeOperation = "lighter";
    fxCtx.lineCap = "round";
    for (const p of fxParticles) {
      if (p.smoke) continue;
      const a = Math.max(p.life, 0);
      if (p.streak) {
        // 플레어: 속도 방향으로 늘여 그려 잔상을 만들고, 가운데에 흰 코어를 얹는다
        fxCtx.globalAlpha = a * .85;
        fxCtx.strokeStyle = p.color;
        fxCtx.lineWidth = p.size;
        fxCtx.beginPath();
        fxCtx.moveTo(p.x - p.vx * 2.8, p.y - p.vy * 2.8);
        fxCtx.lineTo(p.x, p.y);
        fxCtx.stroke();
        fxCtx.globalAlpha = a * .9;
        fxCtx.fillStyle = "#fff2c8";
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size * .36, 0, Math.PI * 2);
        fxCtx.fill();
        continue;
      }
      fxCtx.globalAlpha = a * .8;   // 겹쳐도 하얗게 날아가지 않게
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    }

    // 3) 충격파 링
    fxCtx.globalAlpha = 1;
    for (const g of fxRings) {
      g.r += g.vr; g.vr *= .93; g.life -= g.decay;
      if (g.life <= 0) continue;
      fxCtx.strokeStyle = `rgba(${g.color},${.6 * g.life})`;
      fxCtx.lineWidth = Math.max(1, g.w * g.life);
      fxCtx.beginPath();
      fxCtx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      fxCtx.stroke();
    }
    fxRings = fxRings.filter(g => g.life > 0);

    // 4) 폭발 섬광 (화면 전체를 순간적으로 밝힘)
    if (flash > .01) {
      fxCtx.fillStyle = `rgba(255,236,190,${flash * .4})`;
      fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
      flash *= .79;
    } else flash = 0;

    // 5) 미사일 본체는 다시 일반 합성으로 (금속 질감 유지)
    fxCtx.globalCompositeOperation = "source-over";
    fxCtx.globalAlpha = 1;
    if (missile) updateMissile(now);

    fxCtx.globalAlpha = 1;
    fxCtx.shadowBlur = 0;

    if (fxParticles.length || fxRings.length || missile || flash) {
      requestAnimationFrame(fxLoop);
    } else {
      fxRunning = false;
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    }
  }

  // 출제 덱 = 아직 안 나온 나라 풀. 미리 섞지 않고 뽑을 때마다 가중 추출한다.
  function buildDeck() {
    return COUNTRIES.slice();
  }

  // 정답 비교용: 공백 제거 + 소문자화 (예: "워싱턴 D.C." ≈ "워싱턴dc")
  function normalize(str) {
    return str.replace(/\s+/g, "").replace(/\./g, "").toLowerCase();
  }

  // 남은 풀에서 **비복원 가중 추출**로 한 장 뽑는다.
  //
  // 왜 "복원 추출"이 아니라 비복원인가 —
  // 뽑고 다시 넣는 방식이면 같은 나라가 또 나오거나 끝까지 안 나오는 나라가 생겨
  // "한 바퀴 중복 없음"과 "100개국 전부 출제"가 깨진다(= 세계일주 완주 연출이 거짓말이 된다).
  // 뽑은 나라를 풀에서 빼면 확률로 고르면서도 그 두 성질이 그대로 지켜진다.
  //
  // 확률은 **등급 단위**다. 나라별 가중치를 그대로 쓰면 등급마다 나라 수가 달라
  // (16/19/24/23/18) 의도한 비율이 안 나온다. 그래서 등급 가중치를 그 등급에
  // 남은 개수로 나눠 나라별 가중치를 만든다 → 등급이 비면 자동으로 후보에서 빠지고
  // 남은 등급끼리 확률이 재분배된다.
  //
  // 가중치는 진행도에 따라 START → END로 기울어진다. 고정이면 1등급이 소진되는
  // 53번째 문제 전까지 난이도가 완전히 평평해진다(측정 확인). 기울이면 초반 복불복은
  // 그대로 두면서 중반부터 완만하게 올라간다.
  const TIER_W_START = { 1: 30, 2: 25, 3: 20, 4: 15, 5: 10 };   // 첫 문제 기준 등급별 출제 확률(%)
  const TIER_W_END   = { 1: 10, 2: 15, 3: 20, 4: 25, 5: 30 };   // 마지막 문제 기준
  function pickCountry() {
    if (deck.length === 0) deck = buildDeck();

    const p = 1 - deck.length / COUNTRIES.length;      // 진행도 0(첫 문제) ~ 1(마지막)
    const left = {};                                   // 등급별 남은 개수
    for (const c of deck) left[c.diff] = (left[c.diff] || 0) + 1;

    let total = 0;
    const w = deck.map(c => {
      // 덱 이음매에서 직전 나라가 연속으로 나오는 것만 막는다 (가중치 0)
      if (c.code === lastCode && deck.length > 1) return 0;
      const tw = TIER_W_START[c.diff] + (TIER_W_END[c.diff] - TIER_W_START[c.diff]) * p;
      const v = tw / left[c.diff];
      total += v;
      return v;
    });

    let r = Math.random() * total, i = 0;
    while (i < w.length - 1 && r >= w[i]) { r -= w[i]; i++; }

    const c = deck.splice(i, 1)[0];
    lastCode = c.code;
    return c;
  }

  function updateHud() {
    const l = Math.max(lives, 0);
    const livesEl = document.getElementById("lives");
    livesEl.textContent = "❤️".repeat(l) + "🖤".repeat(MAX_LIVES - l);
    // 목숨을 다 잃은 뒤 주어지는 마지막 한 번 (여기서 또 틀리면 게임오버)
    livesEl.classList.toggle("last-chance", lives === 0);
    document.getElementById("q-score").textContent = `정답 ${score}`;
  }

  function startGame() {
    score = 0;
    lives = MAX_LIVES;
    lastCode = null;
    deck = [];        // 새 판이면 덱도 새로 섞어서 시작
    laps = 0;
    stopAnswerTimer();
    lapClear.classList.add("hidden");
    closeRankModal();   // 모달 열어둔 채 시작하는 경우 대비
    lastPos = null;   // 첫 비행은 지도 중앙에서 출발
    midFlight = false;
    // 이전 판의 이펙트/경보 잔상 정리
    missile = null;
    fxParticles = []; fxRings = []; flash = 0;
    document.body.classList.remove("alarm");
    updateHud();
    armAnswerInput();   // 지난 판의 입력값·정오답 색이 새 판 첫 비행에 남지 않게
    // 피드백도 같이 지운다. 평소엔 비행 중 유지되다 idleAtDest에서 지워지지만,
    // 새 판 첫 비행에는 지난 판의 "⏰ 시간 초과! …"가 그대로 남아 보인다.
    const fb0 = document.getElementById("feedback");
    fb0.textContent = ""; fb0.className = "feedback";
    document.body.classList.add("flying");  // 비행 레이어 표시
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    goNext();
  }

  // 다음 나라 뽑아서 비행 출발 (이전 피드백·입력값은 비행 중 유지 → 도착 시 지워짐)
  function goNext() {
    currentCountry = pickCountry();

    // 입력창 초기화·활성화는 여기서 하지 않는다. **문제 시작 = 도착 시점**(armAnswerInput)이다.
    // 출발 지점에서 열어버리면 비행 중 Enter가 그대로 채점돼 미사일이 오발사된다.
    answerInput.placeholder = PLACEHOLDER_FLYING;
    // focus는 여기서만 잡는다 — 이 함수는 유저 제스처(Enter) 안에서 불리지만
    // flyTo 완료 콜백은 rAF라 제스처 밖이라 모바일에서 키보드를 못 올린다.
    // 한 번 잡은 포커스는 게임 내내 놓지 않는다 (readOnly도 쓰지 않는 이유).
    answerInput.focus();

    flyTo(currentCountry);
  }

  // 도착 = 새 문제 시작. 입력 상태를 여기서 한 번에 리셋한다.
  // (goNext에 흩어져 있으면 비행 중에 이미 답을 받을 수 있는 상태가 된다)
  function armAnswerInput() {
    answered = false;
    answerInput.value = "";                    // 비행 중 쳐놓은 글자 제거
    answerInput.className = "answer-input";    // 직전 정답/오답 색 제거
    answerInput.placeholder = PLACEHOLDER_READY;
  }

  // ── 정답 입력 제한시간 ─────────────────────────
  // 도착 시점(flyTo 완료)에 시작해서, 다 되면 오답 처리한다.
  // 게이지는 rAF로 그리지만 **만료 판정은 setTimeout**이 한다 —
  // 탭을 백그라운드로 돌리면 rAF는 멈추므로, 그걸로 판정하면 탭 전환이 곧 치트가 된다.
  const timerFill = document.getElementById("timer-fill");
  const timerNum = document.getElementById("timer-num");
  let answerDeadline = 0, timerRaf = null, timerTimeout = null, lastTick = -1;

  function startAnswerTimer() {
    stopAnswerTimer();
    answerDeadline = performance.now() + ANSWER_TIME;
    lastTick = -1;
    document.body.classList.add("timing");
    timerTimeout = setTimeout(onAnswerTimeout, ANSWER_TIME);
    timerRaf = requestAnimationFrame(timerFrame);
  }
  function stopAnswerTimer() {
    clearTimeout(timerTimeout); timerTimeout = null;
    cancelAnimationFrame(timerRaf); timerRaf = null;
    document.body.classList.remove("timing", "timer-warn", "timer-danger");
  }
  function timerFrame(now) {
    const left = Math.max(0, answerDeadline - now);
    const ratio = left / ANSWER_TIME;
    timerFill.style.transform = `scaleX(${ratio})`;
    timerNum.textContent = (left / 1000).toFixed(1);
    document.body.classList.toggle("timer-warn", ratio <= .6 && ratio > .3);
    document.body.classList.toggle("timer-danger", ratio <= .3);
    const sec = Math.ceil(left / 1000);          // 마지막 3초 초읽기
    if (sec !== lastTick && sec > 0 && sec <= 3) { lastTick = sec; sfx.tick(); }
    if (left > 0) timerRaf = requestAnimationFrame(timerFrame);
  }
  function onAnswerTimeout() {
    stopAnswerTimer();
    if (answered || !document.body.classList.contains("flying")) return;
    checkAnswer(true);                            // 시간 초과 = 오답
  }

  // 100개국 한 바퀴를 다 돌고 마지막 문제까지 맞혔을 때
  function celebrateLap() {
    stopAnswerTimer();
    laps++;
    celebrating = true;
    cancelAnimationFrame(flightAnim);
    midFlight = false;

    // 화면 고정 오브젝트(핀·비행기)는 줌아웃과 함께 어긋나므로 잠시 숨긴다
    pinEl.classList.remove("show");
    planeEl.style.opacity = "0";
    const fb = document.getElementById("feedback");
    fb.textContent = ""; fb.className = "feedback";

    document.getElementById("lap-sub").textContent =
      laps > 1 ? `100개국 전부 방문 · ${laps}바퀴째` : "100개국 전부 방문";
    lapClear.classList.remove("hidden");

    sfx.fanfare();
    spawnConfetti();
    for (let b = 0; b < 7; b++) setTimeout(spawnBurst, 260 + b * 210);
    tweenCamera(WORLD_W / 2, WORLD_H / 2, fitScale(), 900);   // 지구 전체를 보여주며 마무리

    setTimeout(() => {
      celebrating = false;
      lapClear.classList.add("hidden");
      if (!document.body.classList.contains("flying")) return;  // 그 사이 판이 끝났으면 무시
      goNext();                                                 // 새 덱으로 다음 바퀴 시작
    }, 3000);
  }

  function checkAnswer(timedOut = false) {
    // 답을 받을 수 있는 건 **도착해서 타이머가 도는 동안**뿐이다.
    // 비행 중(midFlight)이나 완주 연출 중(celebrating)에 채점이 통과하면
    // 아직 도착하지도 않은 좌표로 미사일이 날아가고, flyTo의 rAF와 updateMissile이
    // 둘 다 placePlane()을 호출해 충돌하며, goNext()가 이중으로 돌아 비행이 겹친다.
    if (answered || midFlight || celebrating) return;
    const typed = answerInput.value.trim();
    if (!timedOut && typed === "") return;  // 빈 입력은 무시 (시간 초과는 예외)
    answered = true;
    stopAnswerTimer();

    const q = currentCountry;
    const isCorrect = !timedOut && normalize(typed) === normalize(q.capital);
    const feedback = document.getElementById("feedback");
    // readOnly는 쓰지 않는다 — 모바일에서 소프트 키보드가 내려가 --kb 인셋이 출렁인다.
    // 채점은 위 가드(answered/midFlight/celebrating)가 막고, 입력값은 도착 시 지워진다.

    if (isCorrect) {
      score++;
      updateHud();
      answerInput.classList.add("correct");
      feedback.textContent = "정답! 🎉";
      feedback.className = "feedback correct";
      // 방금 맞힌 나라가 덱의 마지막 장이었다면 = 100개국 한 바퀴 완주
      if (deck.length === 0) {
        celebrateLap();
      } else {
        launchFireworks();   // 폭죽!
        goNext();            // 곧바로 다음 나라로 출발
      }
    } else {
      lives--;
      updateHud();
      answerInput.classList.add("wrong");
      // 목숨 0에서 한 번 더 틀리면(lives < 0) 격추 → 게임오버. 그 전까진 플레어로 회피.
      const shotDown = lives < 0;
      const head = shotDown ? "💥 격추당했다!" : timedOut ? "⏰ 시간 초과!" : "🔥 플레어로 회피!";
      feedback.innerHTML = `${head} 정답은 <span class="answer-label">${q.capital}</span>`;
      feedback.className = "feedback wrong";

      // 도착지(화면 중앙)의 비행기를 향해 미사일 → 플레어 발사 연출
      const wp = project(q.lat, q.lon);
      const target = worldToScreen(wp.x, wp.y);   // ← x, y 각각 전달 (객체 통째로 넘기면 NaN)
      placePlane(target.x, target.y, -18);
      planeEl.style.opacity = "1";
      launchMissile(target.x, target.y, () => {
        if (shotDown) gameOver();
        else goNext();
      }, shotDown);
    }
  }

  async function gameOver() {
    cancelAnimationFrame(flightAnim);
    stopAnswerTimer();
    midFlight = false;
    document.body.classList.remove("alarm");   // 경보 해제
    document.body.classList.remove("flying");  // 비행 레이어 숨김
    overviewCamera();                          // 지도 전체 보기로 줌아웃
    quizScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    document.getElementById("result-score").textContent = `정답 ${score}개`;

    // 이번 기록이 최고 기록을 넘었는지.
    // **서버 랭킹 기준**으로 비교한다 → 결과 화면의 "최고 N"과 랭킹표의 숫자가 항상 일치한다.
    // 반드시 submitScore 전에 조회해야 한다(안 그러면 방금 점수가 포함됨).
    let prevBest;
    try { prevBest = await bestScore(playerName); }
    catch (e) { prevBest = localBest(playerName); console.warn(e); }
    const isBest = score > prevBest;
    document.getElementById("result-who").textContent =
      isBest && prevBest >= 0 ? `${playerName} · 최고 기록 경신! (이전 ${prevBest})`
      : isBest                ? playerName
      : `${playerName} · 최고 ${prevBest}`;

    let emoji, msg;
    if (score >= 20)      { emoji = "🏆"; msg = "지리 박사 인정! 미사일도 못 막았네!"; }
    else if (score >= 10) { emoji = "🎉"; msg = "훌륭한 조종 실력이야!"; }
    else if (score >= 5)  { emoji = "🙂"; msg = "나쁘지 않아. 한 번 더 날아볼까?"; }
    else                  { emoji = "💥"; msg = "격추당했다! 수도 좀 더 외워보자!"; }
    if (laps > 0) msg = `세계일주 ${laps}바퀴 완주! ` + msg;

    document.getElementById("result-emoji").textContent = emoji;
    document.getElementById("result-msg").textContent = msg;

    // 점수 등록 → 랭킹 갱신 (실패해도 게임은 그대로, renderRank가 로컬로 폴백)
    try { await submitScore(playerName, score); } catch (e) { console.warn(e); }
    renderRank(resultRank, playerName, 10);
  }

  // ── 이름 입력 / 화면 전환 ──
  // 이름이 있어야 시작. 확정된 이름은 다음 방문에도 그대로 쓰도록 저장.
  function beginWithName() {
    const n = cleanName(nameInput.value);
    if (!n) {
      nameInput.value = "";
      nameInput.focus();
      nameInput.classList.remove("shake");
      void nameInput.offsetWidth;              // 애니메이션 재시작용 리플로우
      nameInput.classList.add("shake");
      return;
    }
    playerName = n;
    nameInput.value = n;
    localStorage.setItem("cap_name", n);
    startGame();
  }
  function backToStart() {                     // 결과 화면 → 메인(시작) 화면. 이름도 여기서 바꾼다
    resultScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    nameInput.value = playerName;
    nameInput.focus();
    nameInput.select();
    renderRank(startRank, playerName, 5);
  }

  // 이벤트 연결
  document.getElementById("start-btn").onclick = beginWithName;
  document.getElementById("restart-btn").onclick = startGame;   // 같은 이름으로 재도전
  document.getElementById("home-btn").onclick = backToStart;
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); beginWithName(); }
  });

  // 전체 랭킹 모달: 두 화면의 "전체 랭킹 보기" 버튼 / 닫기 / 배경 클릭 / ESC
  document.querySelectorAll(".rank-more").forEach(b => b.onclick = openRankModal);
  document.getElementById("rank-close").onclick = closeRankModal;
  rankModal.addEventListener("click", (e) => {
    if (e.target === rankModal) closeRankModal();   // 카드 바깥(배경)만
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !rankModal.classList.contains("hidden")) closeRankModal();
  });

  // 첫 진입: 저장된 이름 채우고 랭킹 표시 (시작 화면은 TOP 5)
  nameInput.value = playerName;
  renderRank(startRank, playerName, 5);

  // 창 크기 바뀌면 카메라/폭죽 다시 계산
  window.addEventListener("resize", () => {
    sizeFx();
    sizeOcean();                                 // 넓어진 화면만큼 바다 여백도 다시 잡는다
    syncPlaneSize();                             // 미디어쿼리로 비행기 크기가 바뀌었을 수 있다
    syncKeyboardInset();
    if (midFlight || celebrating) return;        // 비행/완주 연출 중이면 건드리지 않음
    if (document.body.classList.contains("flying")) idleAtDest();  // 도착지 줌인 유지
    else overviewCamera();                        // 시작/결과 화면: 전체 보기
  });

  // Enter: 채점과 동시에 곧바로 다음 나라로 출발
  answerInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    checkAnswer();
  });
</script>
